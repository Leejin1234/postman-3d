<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小熊猫 · 动作预览</title>
<style>body{margin:0;background:#e5e5d8;color:#344f41;font:15px system-ui}canvas{display:block;width:100vw;height:100dvh}header{position:absolute;top:22px;left:22px}h1{font-size:24px;margin:0 0 8px}header p{margin:0;font-size:13px}nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(94%,600px)}button,a{border:1px solid #b9c5af;border-radius:24px;background:#fffc;padding:12px 19px;color:#36503f;text-decoration:none;font:inherit}button[aria-pressed=true]{background:#426751;color:white}#status{position:absolute;top:95px;left:22px;font-size:13px}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<header><h1>小熊猫 · 动作预览</h1><p>站立呼吸 · 骑车 · 行走 · 奔跑 · 划水 · 跳跃</p></header><div id="status">加载模型…</div><nav id="actions"></nav>
<script type="module">
import * as T from 'three';import {FBXLoader} from './vendor/loaders/FBXLoader.js';
const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.3;document.body.append(r.domElement);
const scene=new T.Scene();scene.background=new T.Color('#e5e5d8');scene.add(new T.HemisphereLight('#fff5df','#738572',2));const sun=new T.DirectionalLight('#fff2df',2.5);sun.position.set(3,5,4);scene.add(sun);
const camera=new T.PerspectiveCamera(37,innerWidth/innerHeight,.01,50);camera.position.set(3.4,2.3,3.5);camera.lookAt(0,.9,0);
function normalize(o,height,span){o.updateMatrixWorld(true);let b=new T.Box3().setFromObject(o),size=b.getSize(new T.Vector3());o.scale.multiplyScalar(height?height/size.y:span/Math.max(size.x,size.z));o.updateMatrixWorld(true);b=new T.Box3().setFromObject(o);const c=b.getCenter(new T.Vector3());o.position.sub(new T.Vector3(c.x,b.min.y,c.z));o.updateMatrixWorld(true);return b.getSize(new T.Vector3())}
const loader=new FBXLoader(),root=await loader.loadAsync('./assets/characters/red-panda-v1.fbx');normalize(root,1.72);const tex=await new T.TextureLoader().loadAsync('./assets/characters/red-panda-color-v1.jpg');tex.colorSpace=T.SRGBColorSpace;root.traverse(o=>{if(o.isMesh){o.material=new T.MeshLambertMaterial({map:tex});o.frustumCulled=false}});
const pivot=new T.Group();pivot.add(root);scene.add(pivot);const mixer=new T.AnimationMixer(root);const clips=Object.fromEntries(root.animations.map(c=>[c.name.split('|').at(-1),c]));
const bike=await loader.loadAsync('./assets/motuo.fbx');const bs=normalize(bike,0,1.95);const bikeTex=await new T.TextureLoader().loadAsync('./assets/motuo_basecolor.jpg');bikeTex.colorSpace=T.SRGBColorSpace;bike.traverse(o=>{if(o.isMesh)o.material=new T.MeshLambertMaterial({map:bikeTex})});scene.add(bike);
const water=new T.Mesh(new T.CircleGeometry(2,64),new T.MeshPhongMaterial({color:'#6aa99c',transparent:true,opacity:.48,depthWrite:false,side:T.DoubleSide}));water.rotation.x=-Math.PI/2;water.position.y=.65;scene.add(water);
const floor=new T.Mesh(new T.CircleGeometry(2.4,64),new T.MeshLambertMaterial({color:'#c8d0b9'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
let current,mode='idle';function choose(name){mode=name;if(current)current.fadeOut(.18);current=mixer.clipAction(clips[name]);current.reset().fadeIn(.18).play();bike.visible=name==='sit';water.visible=name==='swim';pivot.position.set(0,0,0);if(name==='sit'){mixer.update(.001);root.updateMatrixWorld(true);const hip=root.getObjectByName('Pelvis').getWorldPosition(new T.Vector3());pivot.position.set(-.10-hip.x,bs.y*.60-hip.y,0)}for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.mode===name));document.querySelector('#status').textContent='小熊猫 / '+labels[name];}
const labels={idle:'站立',sit:'骑车',walk:'走路',run:'跑步',swim:'游泳',jump:'跳跃'};for(const [name,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.mode=name;b.onclick=()=>choose(name);document.querySelector('nav').append(b)}choose('idle');
let prev=0;function draw(t){mixer.update(Math.min((t-prev)/1000,.05));prev=t;r.render(scene,camera);requestAnimationFrame(draw)}requestAnimationFrame(draw);addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script></html>
