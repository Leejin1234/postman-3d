<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>人物/车预览</title>
<style>body{margin:0;background:#333}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/loaders/FBXLoader.js": "./vendor/loaders/FBXLoader.js"
} }
</script>
</head>
<body>
<canvas id="c" width="1200" height="800"></canvas>
<div id="t" style="position:fixed;left:6px;top:6px;color:#fff;font:12px monospace;white-space:pre"></div>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setClearColor(0x5a6672);
renderer.autoClear = false;
const loader = new FBXLoader();
const texLoader = new THREE.TextureLoader();

function fitY(obj, target) {
  const b = new THREE.Box3().setFromObject(obj);
  const s = b.getSize(new THREE.Vector3());
  obj.scale.setScalar(target / s.y);
  obj.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(obj);
  const c = b2.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, b2.min.y, c.z));
  return b2.getSize(new THREE.Vector3());
}
function applyTex(root, tex) {
  tex.colorSpace = THREE.SRGBColorSpace;
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    o.material = mats.map(m => new THREE.MeshLambertMaterial({ map: tex, name: m ? m.name : '' }));
    if (o.material.length === 1) o.material = o.material[0];
  });
}

const boy = await loader.loadAsync('./assets/boy2.fbx');
applyTex(boy, await texLoader.loadAsync('./assets/boy2_basecolor.jpg'));
const bs = fitY(boy, 4);

const bike = await loader.loadAsync('./assets/motuo.fbx');
applyTex(bike, await texLoader.loadAsync('./assets/motuo_basecolor.jpg'));
const bk = fitY(bike, 2.6);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x999999, 1.3));
const d = new THREE.DirectionalLight(0xffffff, 1.0); d.position.set(6, 10, 8); scene.add(d);
scene.add(boy);
const s2 = new THREE.Scene();
s2.add(new THREE.HemisphereLight(0xffffff, 0x999999, 1.3));
const d2 = new THREE.DirectionalLight(0xffffff, 1.0); d2.position.set(6, 10, 8); s2.add(d2);
s2.add(bike);
[scene, s2].forEach(s => s.add(new THREE.AxesHelper(3)));

function view(sc, pos, look, x, y, w, h) {
  const cam = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);
  cam.position.set(...pos); cam.lookAt(...look);
  renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.setScissorTest(true);
  renderer.render(sc, cam);
}
renderer.clear();
view(scene, [0, 2, 9], [0, 2, 0], 0, 400, 400, 400);      // boy front (+Z)
view(scene, [9, 2, 0], [0, 2, 0], 400, 400, 400, 400);    // boy right (+X)
view(scene, [0, 9, 0.01], [0, 0, 0], 800, 400, 400, 400); // boy top
view(s2, [0, 1.4, 7], [0, 1.2, 0], 0, 0, 400, 400);       // bike front(+Z)
view(s2, [7, 1.4, 0], [0, 1.2, 0], 400, 0, 400, 400);     // bike right(+X)
view(s2, [0, 7, 0.01], [0, 0, 0], 800, 0, 400, 400);      // bike top
document.getElementById('t').textContent =
  `boy ${bs.x.toFixed(2)} ${bs.y.toFixed(2)} ${bs.z.toFixed(2)}   bike ${bk.x.toFixed(2)} ${bk.y.toFixed(2)} ${bk.z.toFixed(2)}
上排: 人物 +Z正视 / +X侧视 / 俯视      下排: 电动车 +Z正视 / +X侧视 / 俯视`;
</script>
</body>
</html>
